[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcrort"
version = "0.2.0"
description = "Provenance-Constrained Recipient-Optimal Relation Transport"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "PC-RORT contributors"}]
dependencies = ["numpy>=1.24", "scipy>=1.11", "cvxpy>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyterlab>=4", "ipykernel>=6", "matplotlib>=3.7", "pandas>=2"]
models = ["torch>=2", "torchvision>=0.15", "timm>=0.9", "scikit-learn>=1.3", "pandas>=2", "PyYAML>=6", "matplotlib>=3.7", "tqdm>=4"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9", "sqlalchemy>=2", "psycopg[binary]>=3.2", "alembic>=1.13", "passlib[bcrypt]>=1.7", "PyJWT>=2.9", "celery[redis]>=5.4", "boto3>=1.35", "slowapi>=0.1", "pydantic-settings>=2.4", "pillow>=10"]
federated = ["flwr>=1.5"]

[project.scripts]
pcrort = "pcrort.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pcrort*", "data*", "models*", "training*", "federated*", "evaluation*", "experiments*", "utils*", "webapp*"]
exclude = ["tests*", "notebooks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
