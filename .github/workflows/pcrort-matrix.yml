name: PC-RORT matrix verification

on:
  push:
    branches: ["feature/pcrort-matrix-core"]
  pull_request:
    paths:
      - "pcrort/**"
      - "tests/test_pcrort_*.py"
      - "experiments/run_pcrort_matrix.py"
      - "requirements.txt"
      - ".github/workflows/pcrort-matrix.yml"

jobs:
  matrix-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused numerical dependencies
        run: python -m pip install numpy scipy cvxpy pytest
      - name: Unit tests
        run: python -m pytest tests/test_pcrort_matrix.py tests/test_pcrort_robust.py -q
      - name: Smoke-test uncertainty experiment
        run: |
          python -m experiments.run_pcrort_matrix \
            --samples 30 --candidates 2 --dimensions 1 \
            --mismatches 0.3 --reps 2 --bootstrap 15 \
            --max-iterations 30 --out results/ci_smoke.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pcrort-smoke-output
          path: results/ci_smoke.*
